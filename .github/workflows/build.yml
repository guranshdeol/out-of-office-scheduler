name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # lets the attestation prove it was made by this workflow
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Write checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'installers/*'
      - uses: softprops/action-gh-release@v2
        with:
          name: OOO Scheduler ${{ github.ref_name }}
          generate_release_notes: true
          files: installers/*
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `OOO Scheduler-*-mac-arm64.dmg` |
            | macOS (Intel) | `OOO Scheduler-*-mac-x64.dmg` |
            | Windows | `OOO Scheduler-*-win-x64-setup.exe` (or `arm64`) |
            | Linux | `.AppImage` or `.deb` for `x86_64` / `arm64` |

            Builds are not code-signed yet. See [Installing](https://github.com/${{ github.repository }}#installing) for the one-time macOS and Windows prompts.

            **Verify a download:** compare it with `SHA256SUMS.txt`, or check where it was built with
            `gh attestation verify <file> --repo ${{ github.repository }}`.
